# The published interface contract for the run surface.
#
# Hand-authored. No `api-contract` skill is installed, so this file carries no
# rule enforcement beyond AC-0009, which asserts that the routes the
# application actually serves **in its generated OpenAPI document** match the
# routes described here — compared document-to-document, not by inspection.
#
# That comparison is blind to a route absent from the schema, and this
# delivery adds two: `GET /runs/{run_id}`, registered with
# `include_in_schema=False` because it serves the browser page rather than
# JSON, and the `/static` asset mount. Both are served and neither appears
# here or in the generated paths, so each is covered by its own check
# (`tests/api/test_static_ui.py`) rather than by AC-0009. A future
# schema-hidden route would escape AC-0009 the same way.
#
# Within `stream_events`, which this delivery owns, one field differs between
# this file and the generated document, on purpose. (Elsewhere the generated
# document still serves FastAPI's default response descriptions where this
# file commits specific text; those operations are owned by other specs and
# nothing here claims they match.) `Last-Event-ID` is committed here as
# `integer, minimum: 0` —
# the value domain a caller may send — but the route types it as a raw string,
# so the generated document serves it as `string | null`. That is deliberate:
# the header is judged character by character, and typing it `int` would let
# pydantic's lax coercion turn `+1` or `1_0` into a valid cursor before any
# check ran, which AC-0323 forbids. AC-0009 compares parameter names and
# required flags, not schemas, so this difference is recorded here rather than
# caught there.
#
# The foundation and run-state specs own the JSON and approval operations.
# `walking-skeleton-evidence` owns the server-sent-event operation and its
# reconnect semantics.
openapi: 3.1.0

info:
  title: Company Intelligence Desk — runs
  version: 0.1.0
  description: >
    Starting a run, reading its current state, and reading its event log.
    The event log is the system of record; the snapshot is a projection over it.

paths:
  /runs:
    post:
      operationId: start_run
      summary: Start a run
      description: >
        Commits the run row, its coordinator step and the `run.requested`
        event in one transaction. All three or none. When `agent_role` is
        `first-published-analysis`, the `analysis` object is required and
        the named snapshot is validated before the run is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "201":
          description: The run was created and is readable at its snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedRun"
        "400":
          # Scoped to this response, not to the operation: `walking-skeleton-
          # foundation` owns `start_run`, and this delivery adds only the
          # same-origin refusal.
          x-spec: docs/specs/walking-skeleton-evidence/spec.md#watching-from-a-browser
          description: A present Origin header does not match the API's origin.
        "422":
          description: >
            The request body is not valid, or the analysis role/object
            combination is wrong, or the CIK, as-of date, or snapshot
            reference is unsupported or malformed, or the snapshot is
            absent, digest-mismatched, or manifest-mismatched (AC-0411).
        "503":
          x-spec: >
            docs/specs/first-published-analysis/spec.md#publishing-through-the-existing-run-boundary
          description: >
            Object store dependency unavailable. No run was created.

  /runs/{run_id}/analysis:
    get:
      operationId: read_analysis
      summary: Read a completed analysis artifact
      x-spec: >
        docs/specs/first-published-analysis/spec.md#publishing-through-the-existing-run-boundary
      description: >
        Returns the complete typed analysis artifact when the run completed
        successfully. No authentication is required: the artifact contains
        only public SEC evidence. The Phase 1 direct-read posture applies
        (AC-0415): any caller that can reach the loopback-bound API and knows
        a run id may read it. The response omits initiating-principal and
        SEC-contact values.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The complete typed analysis artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedAnalysis"
        "404":
          description: No such run.
        "409":
          description: >
            Run is not completed, is not an analysis run, or the artifact
            reference is absent, unreadable, digest-mismatched, or
            schema-invalid (AC-0414).
        "422":
          description: run_id is not a UUID.

  /runs/{run_id}/snapshot:
    get:
      operationId: read_snapshot
      summary: Read a run's current state and cursor
      description: >
        A client uncertain of its cursor reads this, discards local state and
        resumes at `as_of_seq`. No cursor is refused on age.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The run's state and the sequence number it is current to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "404":
          description: No such run.
        "422":
          description: >
            `run_id` is not a UUID. Declared because the surface really does
            serve it — a malformed identifier is refused rather than looked up.

  /runs/{run_id}/events:
    get:
      operationId: read_events
      summary: Read a run's committed events in sequence order
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          required: false
          description: >
            Return events with `seq` strictly greater than this. The client
            owns the cursor.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        "200":
          description: The events after the cursor, in `seq` order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "404":
          description: No such run.
        "422":
          description: >
            `run_id` is not a UUID, or `after`/`limit` is outside its bounds.

  /runs/{run_id}/events/stream:
    get:
      operationId: stream_events
      summary: Stream a run's committed events in sequence order
      x-spec: docs/specs/walking-skeleton-evidence/spec.md#watching-from-a-browser
      description: >
        Serves committed events as server-sent events. Each frame carries the
        committed sequence as `id` and one JSON Event envelope as `data`, and
        sets **no** `event:` field — the committed event type travels in the
        envelope's `type` member, so a single `EventSource` `onmessage`
        handler reads every type, including one added to the domain
        vocabulary later. `Last-Event-ID` takes precedence over `after`. The
        response closes after a terminal event is emitted.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          required: false
          description: >
            Emit events with `seq` strictly greater than this cursor when no
            `Last-Event-ID` header is present. The value must not be greater
            than the run's highest committed sequence.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: >
            Preferred resume cursor. It must be a non-negative integer no
            greater than the run's highest committed sequence.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: >
            Committed events after the selected cursor. The stream closes
            after `run.completed`, `run.failed`, or `run.cancelled`.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: No such run.
        "422":
          description: >
            `run_id` is not a UUID; or **any supplied** cursor — `Last-Event-ID`
            or `after`, whether or not it is the one selected — is not a bare
            non-negative decimal integer; or the **selected** cursor is ahead of
            the run's highest committed sequence. A malformed `after` is refused
            even when a valid `Last-Event-ID` outranks it.

  /runs/{run_id}/steps/{step_id}/decision:
    post:
      operationId: record_approval_decision
      summary: Record an approval decision for a suspended step
      description: >
        Grants or rejects pending tool calls for a suspended step. The request
        must name the `seq` of the `step.suspended` event it answers; a
        decision against an outdated suspension is refused. The `Origin` header
        must match the API's own origin; a missing or foreign origin is refused
        (CSRF defence, AC-0328).
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: step_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: The decision was committed. Returns the seq of the last appended event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "400":
          description: Origin header absent or does not match the API's own origin.
        "404":
          description: No such run or step.
        "409":
          description: >
            Decision refused — wrong suspension seq, step not awaiting a
            decision, or malformed call-id/decision set.
        "422":
          description: Request body is not valid.

components:
  schemas:
    AnalysisRequest:
      type: object
      required: [cik, as_of_date, snapshot_ref]
      additionalProperties: false
      x-spec: >
        docs/specs/first-published-analysis/spec.md#publishing-through-the-existing-run-boundary
      description: >
        Analysis parameters for a first-published-analysis run. Required when
        agent_role is first-published-analysis; refused for every other role.
        Unknown fields are refused (additionalProperties: false). Only the
        three canonical fields enter the persisted request object (AC-0411).
      properties:
        cik:
          type: string
          description: The canonical CIK (0000320193 for this slice).
        as_of_date:
          type: string
          description: The as-of date for the analysis in YYYY-MM-DD format.
        snapshot_ref:
          type: string
          description: >
            Scope-qualified reference to the immutable snapshot. Must match
            ced-first-published-analysis-snapshot/[0-9a-f]{64}; overlong,
            wrong-scope, non-hex, uppercase, or trailing-newline values are
            refused (AC-0411).

    PublishedAnalysis:
      type: object
      additionalProperties: false
      description: >
        The complete deterministic analysis artifact. Contains a fixed-format
        memo and a machine-readable evidence manifest. Decimal values are
        serialised as canonical strings. Execution-varying fields (run id,
        retrieval time) are excluded so identical pinned inputs produce
        identical bytes (AC-0410). The response omits initiating-principal
        and SEC-contact values (AC-0415).
      x-spec: >
        docs/specs/first-published-analysis/spec.md#publishing-through-the-existing-run-boundary
      required: [schema_version, cik, as_of_date, source_url, filing_digest, memo, evidence_manifest]
      properties:
        schema_version:
          type: string
        cik:
          type: string
        as_of_date:
          type: string
        source_url:
          type: string
        filing_digest:
          type: string
        memo:
          $ref: "#/components/schemas/Memo"
        evidence_manifest:
          $ref: "#/components/schemas/EvidenceManifest"

    Memo:
      type: object
      additionalProperties: false
      description: The fixed-format research memo.
      required: [title, claims]
      properties:
        title:
          type: string
        claims:
          type: array
          items:
            $ref: "#/components/schemas/Claim"

    Claim:
      type: object
      additionalProperties: false
      description: One factual claim in the analysis memo.
      required: [claim_id, text, evidence_refs]
      properties:
        claim_id:
          type: string
        text:
          type: string
        evidence_refs:
          type: array
          items:
            type: string

    EvidenceManifest:
      type: object
      additionalProperties: false
      description: Machine-readable evidence manifest for one analysis artifact.
      required: [sources, facts, calculations, claim_links]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceSource"
        facts:
          type: array
          items:
            $ref: "#/components/schemas/FilingFact"
        calculations:
          type: array
          items:
            $ref: "#/components/schemas/Calculation"
        claim_links:
          type: array
          items:
            $ref: "#/components/schemas/ClaimLink"

    EvidenceSource:
      type: object
      additionalProperties: false
      description: One archived SEC source referenced by the evidence manifest.
      required: [source_id, archived_url, digest, source_ref]
      properties:
        source_id:
          type: string
        archived_url:
          type: string
        digest:
          type: string
        source_ref:
          type: string

    FilingFact:
      type: object
      additionalProperties: false
      description: >
        One validated XBRL numeric fact extracted from the filing.
        decimal_value is a string because canonical JSON serialises Decimal
        fields via str().
      required: [evidence_id, concept, context, period, unit, scale, decimal_value, source_id, source_fragment]
      properties:
        evidence_id:
          type: string
        concept:
          type: string
        context:
          type: string
        period:
          $ref: "#/components/schemas/Period"
        unit:
          type: string
        scale:
          type: integer
        decimal_value:
          type: string
        source_id:
          type: string
        source_fragment:
          type: string

    Period:
      type: object
      additionalProperties: false
      description: XBRL duration context period (start and end date strings).
      required: [start_date, end_date]
      properties:
        start_date:
          type: string
        end_date:
          type: string

    Calculation:
      type: object
      additionalProperties: false
      description: >
        Lineage record for one deterministic arithmetic claim.
        numerator, denominator, and value are strings because canonical JSON
        serialises Decimal fields via str().
      required: [evidence_id, operation, input_fact_refs, formula, numerator, denominator, rounding_rule, output_scale, unit, value]
      properties:
        evidence_id:
          type: string
        operation:
          type: string
        input_fact_refs:
          type: array
          items:
            type: string
        formula:
          type: string
        numerator:
          type: string
        denominator:
          type: string
        rounding_rule:
          type: string
        output_scale:
          type: integer
        unit:
          type: string
        value:
          type: string

    ClaimLink:
      type: object
      additionalProperties: false
      description: One entry linking a claim id to its calculation.
      required: [claim_id, calculation_ref]
      properties:
        claim_id:
          type: string
        calculation_ref:
          type: string

    StartRunRequest:
      type: object
      required: [principal, agent_role]
      properties:
        principal:
          type: string
          minLength: 1
          # The counterpart of `ATTRIBUTION_MAX_LENGTH` in
          # `src/ced/api/models.py`; the two carry the same number and must be
          # changed together. **AC-0009 does not compare them** — an earlier
          # version of this comment said it did, but that check compares the
          # route table and excludes `components.schemas` by design. The check
          # that holds these two in step lives in `tests/api`.
          #
          # Both fields are self-asserted attribution on an unauthenticated
          # surface and are stored as unconstrained `text`, so without a bound
          # one request can persist an arbitrarily large string that every
          # later read of that run returns. 256 is far above any real principal
          # or role name and far below anything worth storing.
          maxLength: 256
          description: The initiating user. A run is attributed, never anonymous.
        agent_role:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            The coordinator role the first step runs under. An agent role is a
            first-class security object, assigned here and never by a model.
        analysis:
          description: >
            Optional analysis parameters. Required when agent_role is
            first-published-analysis; refused for every other role (AC-0411).
          anyOf:
            - $ref: "#/components/schemas/AnalysisRequest"
            - type: "null"

    StartedRun:
      type: object
      required: [run_id, step_id, seq]
      properties:
        run_id:
          type: string
          format: uuid
        step_id:
          type: string
          format: uuid
        seq:
          type: integer
          description: The `seq` allocated to the `run.requested` event.

    Snapshot:
      type: object
      required: [run_id, state, as_of_seq]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - requested
            - claimed
            - running
            - awaiting_approval
            - expired
            - completed
            - failed
            - cancelled
        as_of_seq:
          type: integer

    Event:
      type: object
      required: [schema_version, run_id, seq, type, principal]
      properties:
        schema_version:
          type: integer
        run_id:
          type: string
          format: uuid
        seq:
          type: integer
        type:
          type: string
        principal:
          type: string
        step_id:
          type: [string, "null"]
          format: uuid
        agent_role:
          type: [string, "null"]
        payload_ref:
          type: [string, "null"]
        idempotency_key:
          type: [string, "null"]

    EventPage:
      type: object
      required: [run_id, events]
      properties:
        run_id:
          type: string
          format: uuid
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"

    DecisionPair:
      type: object
      required: [call_id, granted]
      properties:
        call_id:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            The tool-call id of the deferred tool call being decided. Bounded
            at ATTRIBUTION_MAX_LENGTH so a single request cannot persist an
            arbitrarily long string (AC-0328).
        granted:
          type: boolean
          description: >
            True for approval.granted, false for approval.rejected.

    ApprovalDecisionRequest:
      type: object
      required: [suspension_seq, decisions, principal]
      properties:
        suspension_seq:
          type: integer
          minimum: 1
          description: >
            The seq of the `step.suspended` event this decision answers.
            The decision path refuses a seq that is not the step's latest
            suspension (AC-0334).
        decisions:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: "#/components/schemas/DecisionPair"
          description: >
            One pair per pending call id. At most ATTRIBUTION_MAX_LENGTH
            pairs so the number of rows one request appends is finite
            (AC-0328).
        principal:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            The approver's self-asserted identity. Unauthenticated in Phase 1;
            recorded for inspectability.

    DecisionResult:
      type: object
      required: [last_seq]
      properties:
        last_seq:
          type: integer
          description: The seq of the last event committed by this decision.
