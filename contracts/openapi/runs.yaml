# The published interface contract for the run surface.
#
# Hand-authored. No `api-contract` skill is installed, so this file carries no
# rule enforcement beyond AC-0009, which asserts that the routes the
# application actually serves match the routes described here — compared
# against the generated document, not by inspection.
#
# Four routes: the three from the foundation spec, plus the approval-decision
# operation this spec adds (AC-0328). The events route is built only far enough
# to serve a cursor projection over committed events; its reconnect semantics,
# `Last-Event-ID` preference and browser criteria belong to
# `walking-skeleton-evidence`.
openapi: 3.1.0

info:
  title: Company Intelligence Desk — runs
  version: 0.1.0
  description: >
    Starting a run, reading its current state, and reading its event log.
    The event log is the system of record; the snapshot is a projection over it.

paths:
  /runs:
    post:
      operationId: start_run
      summary: Start a run
      description: >
        Commits the run row, its coordinator step and the `run.requested`
        event in one transaction. All three or none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "201":
          description: The run was created and is readable at its snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartedRun"
        "422":
          description: The request body is not valid.

  /runs/{run_id}/snapshot:
    get:
      operationId: read_snapshot
      summary: Read a run's current state and cursor
      description: >
        A client uncertain of its cursor reads this, discards local state and
        resumes at `as_of_seq`. No cursor is refused on age.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The run's state and the sequence number it is current to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "404":
          description: No such run.
        "422":
          description: >
            `run_id` is not a UUID. Declared because the surface really does
            serve it — a malformed identifier is refused rather than looked up.

  /runs/{run_id}/events:
    get:
      operationId: read_events
      summary: Read a run's committed events in sequence order
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          required: false
          description: >
            Return events with `seq` strictly greater than this. The client
            owns the cursor.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        "200":
          description: The events after the cursor, in `seq` order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "404":
          description: No such run.
        "422":
          description: >
            `run_id` is not a UUID, or `after`/`limit` is outside its bounds.

  /runs/{run_id}/steps/{step_id}/decision:
    post:
      operationId: record_approval_decision
      summary: Record an approval decision for a suspended step
      description: >
        Grants or rejects pending tool calls for a suspended step. The request
        must name the `seq` of the `step.suspended` event it answers; a
        decision against an outdated suspension is refused. The `Origin` header
        must match the API's own origin; a missing or foreign origin is refused
        (CSRF defence, AC-0328).
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: step_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: The decision was committed. Returns the seq of the last appended event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "400":
          description: Origin header absent or does not match the API's own origin.
        "404":
          description: No such run or step.
        "409":
          description: >
            Decision refused — wrong suspension seq, step not awaiting a
            decision, or malformed call-id/decision set.
        "422":
          description: Request body is not valid.

components:
  schemas:
    StartRunRequest:
      type: object
      required: [principal, agent_role]
      properties:
        principal:
          type: string
          minLength: 1
          # The counterpart of `ATTRIBUTION_MAX_LENGTH` in
          # `src/ced/api/models.py`; the two carry the same number and must be
          # changed together. **AC-0009 does not compare them** — an earlier
          # version of this comment said it did, but that check compares the
          # route table and excludes `components.schemas` by design. The check
          # that holds these two in step lives in `tests/api`.
          #
          # Both fields are self-asserted attribution on an unauthenticated
          # surface and are stored as unconstrained `text`, so without a bound
          # one request can persist an arbitrarily large string that every
          # later read of that run returns. 256 is far above any real principal
          # or role name and far below anything worth storing.
          maxLength: 256
          description: The initiating user. A run is attributed, never anonymous.
        agent_role:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            The coordinator role the first step runs under. An agent role is a
            first-class security object, assigned here and never by a model.

    StartedRun:
      type: object
      required: [run_id, step_id, seq]
      properties:
        run_id:
          type: string
          format: uuid
        step_id:
          type: string
          format: uuid
        seq:
          type: integer
          description: The `seq` allocated to the `run.requested` event.

    Snapshot:
      type: object
      required: [run_id, state, as_of_seq]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - requested
            - claimed
            - running
            - awaiting_approval
            - expired
            - completed
            - failed
            - cancelled
        as_of_seq:
          type: integer

    Event:
      type: object
      required: [schema_version, run_id, seq, type, principal]
      properties:
        schema_version:
          type: integer
        run_id:
          type: string
          format: uuid
        seq:
          type: integer
        type:
          type: string
        principal:
          type: string
        step_id:
          type: [string, "null"]
          format: uuid
        agent_role:
          type: [string, "null"]
        payload_ref:
          type: [string, "null"]
        idempotency_key:
          type: [string, "null"]

    EventPage:
      type: object
      required: [run_id, events]
      properties:
        run_id:
          type: string
          format: uuid
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"

    DecisionPair:
      type: object
      required: [call_id, granted]
      properties:
        call_id:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            The tool-call id of the deferred tool call being decided. Bounded
            at ATTRIBUTION_MAX_LENGTH so a single request cannot persist an
            arbitrarily long string (AC-0328).
        granted:
          type: boolean
          description: >
            True for approval.granted, false for approval.rejected.

    ApprovalDecisionRequest:
      type: object
      required: [suspension_seq, decisions, principal]
      properties:
        suspension_seq:
          type: integer
          minimum: 1
          description: >
            The seq of the `step.suspended` event this decision answers.
            The decision path refuses a seq that is not the step's latest
            suspension (AC-0334).
        decisions:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: "#/components/schemas/DecisionPair"
          description: >
            One pair per pending call id. At most ATTRIBUTION_MAX_LENGTH
            pairs so the number of rows one request appends is finite
            (AC-0328).
        principal:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            The approver's self-asserted identity. Unauthenticated in Phase 1;
            recorded for inspectability.

    DecisionResult:
      type: object
      required: [last_seq]
      properties:
        last_seq:
          type: integer
          description: The seq of the last event committed by this decision.
