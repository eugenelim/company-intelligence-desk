# agentbundle-layout.toml — adopter-owned. Controls where output-producing
# packs write their durable work. Never projected by an install; edit freely.

[architecture]
# Base directory for design efforts. Each effort gets its own folder beneath
# this: <output_dir>/<topic-slug>/. Repo-root-relative.
#
# NOTE: docs/architecture/ holds *current* state per docs/architecture/README.md
# § Designed but unbuilt. A designed-but-unbuilt effort folder placed here
# must carry a STATUS: PLANNED
# marker and link to its governing decision.
output_dir = "docs/architecture"

[research]
# desk-research output stays in the repository, not a personal vault.
# Overrides the user-profile ~/.agentbundle/agentbundle-layout.toml [research]
# value for this repo only; that vault default still applies elsewhere.
#
# Matches the convention documented in docs/product/README.md:
# docs/product/research/<slug>/ — committed desk-research output, distinct from
# findings/ (governance registers) and from gitignored personal scratch.
output_dir = "docs/product/research"

[design]
# Experience-design artifacts: journey maps, service blueprints, screen flows.
# Repo-root-relative. Written here rather than a personal vault because the
# agentic experience is part of the reference implementation an adopter reads,
# not private working material.
output_dir = "docs/ux"

[product]
# Intents land at <output_dir>/intents/<slug>.md. This records the convention
# the repository already follows (six foundation intents predate this file)
# rather than introducing a new one.
output_dir = "docs/product"
