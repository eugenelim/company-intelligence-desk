  { path = "docs/specs/walking-skeleton-foundation/spec.md", kind = "intent", source = { mode = "repo-origin" }, summary = "Erratum: the Shipped walking-skeleton-foundation spec, its plan and its verification ledger name walking-skeleton-agent-runtime as the owner of the compiler, the idempotency behaviour and scope-qualified object keys, and that spec calls itself the first of three Phase 1 specs when Phase 1 is now five. That directory was deleted on 2026-09-20 and the three successor specs own those parts. docs/specs/README.md freezes a Shipped spec, so those pointers are corrected by superseding rather than by editing. ADR-0002 is not covered by that rule and its three references were repointed in place on 2026-09-20, decision text unchanged", needs = [] },
