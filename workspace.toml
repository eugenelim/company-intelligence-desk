# workspace.toml
#
# Repository coordination index. Canonical artifacts own requirements; this
# file records lifecycle membership, source provenance, display summaries, and
# hard dependencies.
#
# Target entries are inline tables with exactly:
#   path, kind, source, summary, needs
#
# Example:
#   { path = "docs/specs/<slug>/spec.md", kind = "spec", source = { mode = "repo-origin" }, summary = "Example spec", needs = [] }
#
# Comments, summaries, list order, tracker labels, and profile hints are
# non-semantic. They must not determine routing, dependency satisfaction,
# processor selection, or dispatch.
#
# Paths are repository-relative POSIX paths. Consumers must reject absolute
# paths, backslashes, ".." segments, and any symlink-resolved target outside the
# repository root.

[backlog]
open = [
  { path = "docs/product/intents/evidence-backed-fund-diligence.md", kind = "intent", source = { mode = "repo-origin" }, summary = "Deferred second demonstration domain: managed funds and ETFs; gated on an RFC amending the charter, not buildable", needs = [] },
  { path = "docs/product/intents/assistant-mediated-operation.md", kind = "intent", source = { mode = "repo-origin" }, summary = "Draft capability intent: conversational control of the desk, bounded by the same authority and provenance as a run. Framed 2026-09-18 from a journey map and service blueprint; nine gaps named, two structural", needs = [] },
  { path = ".github/pull_request_template.md", kind = "defect", source = { mode = "repo-origin" }, summary = "pre-existing-no-top-level-directory: test_no_top_level_directory_is_unrecorded in tests/architecture/test_recorded_layout.py fails on main. `.github` arrived 2026-09-20 in 9e20d97, postdating ADR-0003, so D2's exemption for predating entries misses it and PREDATING cannot carry it; D2's amendment requirement applies. 9e20d97 claims the owner waived the RFC for this file, which AGENTS.md contradicts. Record or retract that waiver. Ask-first", needs = [] },
  { path = "pyproject.toml", kind = "defect", source = { mode = "repo-origin" }, summary = "No dependency or secret scanning exists: AGENTS.md states there is no CI, and neither pip-audit nor an image or secret scanner is wired, so CVEs in the pydantic-ai-slim[bedrock] pin, hypothesis and publicsuffix2 have no owner. Surfaced by the spec-stage security review 2026-09-20; re-confirmed unaddressed by the round-4 security review 2026-09-21", needs = [] },
  { path = "docs/adr/0006-four-r5-deviations-for-phase-1.md", kind = "defect", source = { mode = "repo-origin" }, summary = "ADR-0006 D1 and D2 return conditions, carried as follow-ons in walking-skeleton-step-lifecycle rather than as criteria. D1 returns when the Bedrock IAM shape for bedrock:CountTokens against a geo-prefixed model id is re-derived and count_tokens_before_request can be enabled in production; that spec then gains a criterion that a per-request token bound refuses a request under production wiring. D2 returns when the object-store write path exists so a hash can be written as well as read; that spec then gains a criterion that an instruction hash resolves from the event log alone. Identifiers AC-0271 and AC-0272 were allocated to these on 2026-09-21 and withdrawn the same day, and are not reallocated: an unchecked acceptance criterion is a HARD lint violation at a Shipped transition, so the follow-on carrier is the one spec-and-plan-contract.md prescribes. Owner eugenelim", needs = [] },
  { path = "docs/specs/walking-skeleton-step-lifecycle/plan.md", kind = "defect", source = { mode = "repo-origin" }, summary = "Content-addressing provenance has no criterion because Phase 1 mints no such value. walking-skeleton-role-compilation's AC-0274 third clause refuses every content-addressing value outright and records the general rule, that such a value carries AC-0221's minting-and-provenance test whichever class a ratified document files it under. That rule is assertable only once a minting source exists, and the source is the payload-object write path walking-skeleton-step-lifecycle opens. The spec that opens it adds the provenance criterion and must change AC-0274's categorical refusal case rather than inherit a green test that never checked provenance. Surfaced by the round-5 and round-6 security and adversarial reviews 2026-09-21. Owner eugenelim", needs = [] },
  { path = "docs/specs/walking-skeleton-step-lifecycle/spec.md", kind = "defect", source = { mode = "repo-origin" }, summary = "Which guard refused a role compilation is not recoverable from the event log. walking-skeleton-role-compilation's AC-0261 asserts only what migration 0001's events envelope can carry: that a compile refusal is distinguishable by type from a runtime fault and names the failing role. Naming the specific guard needs either a column on events or a payload object, and that spec writes no payload object and does not amend a foundation-owned table. Becomes buildable when walking-skeleton-step-lifecycle opens the payload-object write path. Owner eugenelim", needs = [] },
  { path = "docs/specs/walking-skeleton-step-lifecycle/plan.md", kind = "defect", source = { mode = "repo-origin" }, summary = "thinking-disable-not-demonstrated-on-a-run-path: on pydantic-ai 2.45.0 AC-0204's compiled thinking=False is defeated downstream by prepare_request (always-thinking profile, or neither flag) and by BedrockConverseModel's adaptive Anthropic branch, and upstream by run settings and Agent.override. An earlier entry called the Bedrock path safe; that read one branch and is false. Obligation: the value the model reads on the executor's run path is False. Owner eugenelim", needs = [] },
  { path = "docs/specs/walking-skeleton-role-compilation/spec.md", kind = "defect", source = { mode = "repo-origin" }, summary = "ac-0261-names-a-type-nothing-appends: the criterion's literal step.failed token is residual wording. Its own clause requires the type to distinguish the event from a runtime fault, and the obligation row states the criterion with no type token, so role.load.failed and role.compile.refused satisfy it and no amendment is owed. The settled reading now sits in the spec's Follow-ons, adjudicated 2026-09-22. Residual: drop the token only if an amendment reopens the spec. Owner eugenelim", needs = [] },
  { path = "src/ced/adapters/postgres/roles.py", kind = "defect", source = { mode = "repo-origin" }, summary = "tools-array-elements-unchecked: _check_integration_record judges the tools array for null, non-list and empty and stops, so a row storing [1] yields IntegrationTool(tool_name=1) against a field declared str, first surfacing inside AC-0233's enumeration rather than as a named refusal. Beyond AC-0273, which enumerates exactly the four shapes already refused, so it needs a criterion in the spec that adds it. Owner eugenelim", needs = [] },
  { path = "migrations/env.py", kind = "defect", source = { mode = "repo-origin" }, summary = "no-lock-timeout-on-migrations: revision 0003's primary-key widening takes ACCESS EXCLUSIVE and builds a unique index, and env.py sets no lock_timeout, so on a populated live database the statement queues behind any open reader while every later query queues behind it. On a restart: no fleet that is a stalled deploy unblocked by hand. Unreachable today: the table is empty in every deployment this spec ships to. Owner decision. Owner eugenelim", needs = [] },
  { path = "docs/architecture/role-configuration-seams/role-configuration-seams.md", kind = "defect", source = { mode = "repo-origin" }, summary = "Both halves of r5 section 4's arbitrary-code control are unowned in Phase 1: membership of the closed integration_registry.kind set, and the compile-time egress check on connection_ref. r5 pairs them as one control. walking-skeleton-role-compilation's migration creates the kind column and nothing in Phase 1 reads it, so a load-time criterion there would guard a field no code consumes; the egress half needs a proxy allowlist Phase 1 does not deploy, and walking-skeleton-authority-containment already places its compensating control in the AWS deployment. Both halves are therefore routed to the AWS deployment. Surfaced by the round-4 security review 2026-09-21. Owner eugenelim", needs = [] },
  { path = "src/ced/domain/quarantine/mint.py", kind = "defect", source = { mode = "repo-origin" }, summary = "Duplicate identity attributes on an ix:nonFraction element resolve last-wins under no recorded rule: dict(attrs) in the mint's reader keeps the last occurrence, so name=\"A\" name=\"B\" mints B where an XML-conformant XBRL processor rejects the document, letting a lenient minting authority disagree with a successor spec's strict resolver. Remedy undetermined: refuse the element, refuse the document, or record a precedence rule. T3 security review 2026-09-22. Owner eugenelim", needs = [] },
]
closed = [
  { path = "src/ced/domain/quarantine/mint.py", kind = "defect", source = { mode = "repo-origin" }, summary = "mint-drops-an-unreadable-identity: closed 2026-09-22 by the first of the three defensible remedies. An ix:nonFraction element declaring no name or no contextRef, or declaring either empty or valueless, now raises UnmintableFactIdentity exactly as a present-but-non-conforming identity does, and no candidate set is minted for the filing. Reason for that remedy over the other two: omitting an attribute is a cheaper route to an uncitable fact than misspelling one, so refusing only the misspelling leaves the wider half of the same steering channel open, and refusing the element rather than the mint would return a short set reporting itself complete. Enforced by _identity() in the mint's reader; nine checks in tests/quarantine/test_mint_constrains_identities.py, all red against the previous guard. The recorded corpus contains no such element, so tests/fixtures/candidate_set_expected.json is unchanged and AC-0238 stays green. Ships without an acceptance criterion by owner decision 2026-09-22. Owner eugenelim", needs = [] },
  { path = "docs/specs/walking-skeleton-role-compilation/plan.md", kind = "defect", source = { mode = "repo-origin" }, summary = "pre-existing-plan-stub-unformatted: `ruff format --check .` exits 1 on plan.md line 250, the AC-0202 red stub in T2's Tests field. ruff formats fenced Python in Markdown, and origin/main is clean, so this branch introduced the only failure the gate reports. Confirmed present at HEAD before any T1 code, and reproduced against `git show HEAD:...plan.md` in a scratch copy. plan.md is hash-pinned by the sealed baseline, so reformatting the block is a controlled amendment and excluding docs/ from the gate is a gate change; neither is the implementer's to take. Closed 2026-09-21 by an owner-authorized controlled amendment reformatting the stub; see docs/specs/walking-skeleton-role-compilation/notes/amendment-2026-09-21-stub-formatting.md. ruff format --check . now exits 0 repository-wide, and the plan stub is byte-identical to the materialized tests/compiler/test_stack_composition.py. Surfaced during T1 execution 2026-09-21. NOTE: backlog.closed cannot mechanically represent this one — the engine requires a closed defect's artifact to report Status: Closed with a resolution, and this artifact is a plan file whose vocabulary is Drafting/Approved/Executing/Done, so no value it can carry satisfies that rule. Recorded here rather than reshaped; the register-shape question is the owner's. Owner eugenelim", needs = [] },
]

# A Ready brief cannot sit in [backlog].open: `Ready` is terminal for kind
# "brief", so the schema reports impossible_transition. Its schema-valid home is
# an initiative's brief_queue, which is where this initiative comes from.
["ini-001"]
name   = "Inspectable Diligence MVP"
status = "active"

["ini-001".work]
# Phase 1 walking skeleton. Cut into three specs on 2026-09-18 after a single
# spec did not converge across three review rounds, then the agent-runtime spec
# was cut into three again on 2026-09-20 because it carried AC-0201 through
# AC-0232 — about two and a half times either sibling. The dependency chain is
# real: everything needs the schema and pool, authority-containment and
# step-lifecycle both need the compiler, and the evidence spec measures a system
# the other four build. The three runtime specs are a chain: step-lifecycle's
# resume criterion needs an approved tool body to run, which needs
# authority-containment's predicate.
queue = [
  { path = "docs/specs/walking-skeleton-role-compilation/spec.md", kind = "spec", source = { mode = "repo-origin" }, summary = "Phase 1 role compilation: framework seam, the role compiler, the four-layer toolset stack with the policy decision point outermost and fail-closed, and the quarantine boundary", needs = [{ type = "local", kind = "spec", path = "docs/specs/walking-skeleton-foundation/spec.md" }] },
  { path = "docs/specs/walking-skeleton-authority-containment/spec.md", kind = "spec", source = { mode = "repo-origin" }, summary = "Phase 1 authority containment: the containment fragment over interpreted arguments, and the policy decision point that refuses on argument value and records the denial", needs = [{ type = "local", kind = "spec", path = "docs/specs/walking-skeleton-foundation/spec.md" }, { type = "local", kind = "spec", path = "docs/specs/walking-skeleton-role-compilation/spec.md" }] },
