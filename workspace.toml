# Phase 1 walking skeleton, now six specs after three cuts. Cut into three on
# 2026-09-18 after a single spec did not converge across three review rounds;
# the agent-runtime spec was cut into three again on 2026-09-20 because it
# carried AC-0201 through AC-0232, about two and a half times either sibling;
# and authority-containment was cut in two on 2026-09-23, separating the
# containment fragment from the policy decision point that installs it.
# The dependency chain below is real and is the authority — this comment is not.
# Everything else needs the schema and pool. authority-containment is now a pure
# domain library and needs the compiler no longer, which is why its only edge is
# the foundation. The decision point needs the compiler, because it extends the
# toolset stack that spec ships. step-lifecycle's resume criterion needs an
# approved tool body to run, which needs the decision point's predicate, and the
