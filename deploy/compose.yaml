# The local substrate for the walking skeleton. Local only, throwaway, no data
# of value. There is no AWS in this spec's test path and no cloud credential.
#
# Use `docker-compose -f deploy/compose.yaml up -d`. The Compose CLI *plugin*
# (`docker compose`) is not installed in the development environment this was
# verified in; the standalone binary is.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      # A throwaway container on a loopback port. Not a credential.
      POSTGRES_PASSWORD: local_only_not_a_secret
      POSTGRES_DB: ced
    ports: ["55432:5432"]
    # `deadlock_timeout` at 200 ms matches Phase 0 spike P2 exactly, which is
    # what lets T4's results be compared with the spike's. It is well below the
    # 1 s default, so deadlocks surface faster here than in production — that
    # qualification travels with every result measured against this container.
    command: >
      postgres -c log_lock_waits=on
               -c deadlock_timeout=200ms
               -c log_min_messages=warning
    volumes:
      # Role creation is provisioning, not migration. In a deployed system the
      # roles and their credentials are created by whatever owns the database
      # instance, and `alembic` authenticates as r7's `migration` identity.
      # Locally the container's init hook stands in for that owner, which keeps
      # `alembic upgrade head` purely about schema.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ced"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The S3-API subset, per runtime-architecture.md § Object store contract.
  # No criterion in walking-skeleton-foundation reads or writes an object; the
  # first payload object is written by walking-skeleton-agent-runtime. It is
  # here because the worker boot sequence verifies the object store is
  # reachable before reporting ready, and a worker that cannot reach it must
  # fail readiness rather than start and deny everything.
  minio:
    # quay.io, not Docker Hub: `docker pull minio/minio` returns "repository
    # does not exist or may require 'docker login'" from this network, and
    # quay.io is MinIO's own registry. Verified 2026-09-18.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local_only_not_a_secret
      MINIO_ROOT_PASSWORD: local_only_not_a_secret
    ports: ["59000:9000", "59001:9001"]
    healthcheck:
      # The image ships `mc`, but not configured against this server, so
      # `mc ready local` has no alias to resolve. The liveness endpoint needs
      # no credential and is what the worker boot sequence's HEAD stands on.
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Two workers, running throughout. AC-0010's "no operator action" holds
  # because the replacement **already existed** — not because a scheduler
  # created one. That is a substitution this spec makes against a deployed
  # ECS service with a desired count, and it is recorded as one.
  #
  # r7's capacity table is a fixed count of 2 with no autoscaling, and at one
  # step in flight per worker that is also the concurrency ceiling: two
  # sequential runs, or one that fans out to two specialists.
  worker-a: &worker
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      CED_WORKER_ID: worker-a
      # Inside the Compose network, Postgres is on its own hostname and the
      # container port, not the published 55432.
      CED_DATABASE_URL_WORKER: postgresql://app_worker:local_only_not_a_secret@postgres:5432/ced
      CED_DATABASE_URL_POLICY: postgresql://app_policy:local_only_not_a_secret@postgres:5432/ced
      # A sleep, not a model call: this suite needs no credential and no spend.
      CED_STEP_BODY_SECONDS: "600"
    depends_on:
      postgres:
        condition: service_healthy
    # The pool polls; nothing depends on the container being restarted for the
    # step to come back, which is what AC-0010 measures. `no` keeps a killed
    # worker dead so the recovery observed is the *other* worker's.
    restart: "no"

  worker-b:
    <<: *worker
    environment:
      CED_WORKER_ID: worker-b
      CED_DATABASE_URL_WORKER: postgresql://app_worker:local_only_not_a_secret@postgres:5432/ced
      CED_DATABASE_URL_POLICY: postgresql://app_policy:local_only_not_a_secret@postgres:5432/ced
      CED_STEP_BODY_SECONDS: "600"
