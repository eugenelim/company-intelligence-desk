[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "company-intelligence-desk"
version = "0.1.0"
description = "An inspectable reference implementation of a governed multi-agent application."
requires-python = "==3.13.*"
license = "Apache-2.0 OR MIT"

# Recorded in docs/specs/walking-skeleton-foundation/plan.md
# § Dependencies & integration before being added, per AGENTS.md.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    # ADR-0002 D1: exact pin, superseding ADR-0001 D5 in part. The `-slim`
    # distribution with the `bedrock` extra is what Phase 0 probed and the only
    # provider this design reaches; the batteries-included `pydantic-ai`
    # meta-package pins `starlette` against FastAPI and does not resolve.
    #
    # Imported by no code in the walking-skeleton-foundation spec — it is here
    # so the dependency-direction gate has a real installed package to forbid.
    "pydantic-ai-slim[bedrock]==2.45.0",
    # Declared because `ced.adapters.bedrock.payload` imports it directly, and
    # AGENTS.md § Coding conventions counts an import missing from the owning
    # manifest as a new dependency even when it resolves locally. **No package
    # is added by this line**: boto3 is already installed as a transitive of
    # the `[bedrock]` extra above, and the version is deliberately left to that
    # extra to resolve rather than pinned twice in disagreement. What changes
    # is that the manifest now records what the code actually imports.
    "boto3",
    # Recorded in docs/specs/walking-skeleton-authority-containment/plan.md
    # § Dependencies & integration. AC-0215 refuses a `host_in_domain`
    # argument that is a public suffix, and the standard library carries no
    # public-suffix list — established by the containment probe of
    # 2026-09-18. A hand-kept list of suffixes goes stale silently; a bundled
    # dataset goes stale at a version bump a reviewer can see.
    "publicsuffix2==2.20191221",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
    # Test-only. AC-0009 reads the hand-authored OpenAPI contract, and there is
    # no YAML parser in the standard library. Beyond the walking-skeleton
    # plan's § Dependencies & integration list, so it went through that spec's
    # Ask-first boundary; owner decision 2026-09-18. No `src/` code imports it.
    "pyyaml==6.0.3",
    # Test-only. Recorded in
    # docs/specs/walking-skeleton-authority-containment/plan.md
    # § Dependencies & integration: the containment property test generates
    # predicate pairs, because the claim is set-theoretic containment over a
    # fragment rather than behaviour at chosen values. No `src/` code imports
    # it.
    "hypothesis==6.168.1",
]

[project.scripts]
# Two deployables from one package, per ADR-0003 D3.
ced-api = "ced.api.main:run"
ced-worker = "ced.worker.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]
# The toolchain governs the code this project authors. Everything excluded here
# predates it and is out of the walking skeleton's scope:
#   .agents/, .claude/, .codex/  vendored agent packs — upstream content
#   spikes/                      throwaway by that directory's own rule
#   tools/                       repository lints that predate this manifest;
#                                the foundation spec touches one of them to add
#                                a regression test, not to restyle it
extend-exclude = [".agents", ".claude", ".codex", "spikes", "tools"]

[tool.ruff.lint]
# `W605` earns its place by history: an invalid escape sequence shipped inside
# revision 0001's shape CHECK, where silencing the warning by deleting the
# backslash would have turned `\.` into "any character" and reopened the type
# bypass rounds 3 through 5 closed. Scoped to that rule rather than all of `W`
# on adjudication's direction; measured clean tree-wide either way.
select = ["E", "F", "I", "UP", "B", "ASYNC", "W605"]

[tool.mypy]
python_version = "3.13"
packages = ["ced"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
# `publicsuffix2` ships no `py.typed` marker and no stubs exist for it. The
# containment package uses one call on it, `get_tld`, and treats the result as
# `object` before comparing, so nothing untyped escapes the boundary.
module = "publicsuffix2"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The event-log adapter reads rows psycopg types as tuple[Any, ...]; the
# boundary is the SQL, and the row shapes are asserted by tests/event_log.
module = "ced.adapters.postgres.*"
warn_return_any = false

[[tool.mypy.overrides]]
# boto3 and botocore ship no py.typed marker and no first-party stubs.
# Types.AmazonWebServicesClientBuilder and the full service interface are
# large-surface enough that stub maintenance would cost more than the
# explicit-credential pattern in ced.adapters.bedrock.payload is worth
# covering; Any is the correct escape hatch here.
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration and fault-injection suites need the Compose substrate; the unit
# and architecture suites do not. `-m "not substrate"` is the offline subset.
markers = [
    "substrate: needs the deploy/compose.yaml stack running",
]
