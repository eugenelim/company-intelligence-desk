# Phase 0 spike substrate. Local only, throwaway, no data of value.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: spike_only_not_a_secret
      POSTGRES_DB: ced
    ports: ["55432:5432"]
    command: >
      postgres -c log_lock_waits=on
               -c deadlock_timeout=200ms
               -c log_min_messages=warning
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ced"]
      interval: 2s
      timeout: 3s
      retries: 20
